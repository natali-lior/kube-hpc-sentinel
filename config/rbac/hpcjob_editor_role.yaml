# This rule is not used by the project kube-hpc-sentinel itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the hpc.nvidia.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kube-hpc-sentinel
    app.kubernetes.io/managed-by: kustomize
  name: hpcjob-editor-role
rules:
- apiGroups:
  - hpc.nvidia.com
  resources:
  - hpcjobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - hpc.nvidia.com
  resources:
  - hpcjobs/status
  verbs:
  - get
