apiVersion: apps/v1
kind: Deployment
metadata:
  name: dcgm-mock-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dcgm-mock-exporter
  template:
    metadata:
      labels:
        app: dcgm-mock-exporter
    spec:
      nodeSelector:
        hpc-sentinel/node-type: "observability"
      tolerations:
        - key: "node-role.kubernetes.io/observability"
          operator: "Exists"
          effect: "NoSchedule"
      serviceAccountName: dcgm-mock-exporter-sa
      containers:
      - name: exporter
        image: dcgm-mock-exporter:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: MAP_NAME
          value: "dcgm-mock-data"
        - name: MAP_NAMESPACE
          value: "monitoring"
        - name: PORT
          value: "9400"
        resources:
          limits:
            cpu: "100m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
        ports:
        - containerPort: 9400
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dcgm-mock-exporter-sa
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dcgm-mock-exporter-role
  namespace: monitoring
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dcgm-mock-exporter-rb
  namespace: monitoring
subjects:
- kind: ServiceAccount
  name: dcgm-mock-exporter-sa
roleRef:
  kind: Role
  name: dcgm-mock-exporter-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: dcgm-mock-exporter
  namespace: monitoring
  labels:
    app: dcgm-mock-exporter
spec:
  ports:
  - name: metrics
    port: 9400
    targetPort: 9400
  selector:
    app: dcgm-mock-exporter
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dcgm-mock-exporter
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: dcgm-mock-exporter
  endpoints:
  - port: metrics
    interval: 10s
