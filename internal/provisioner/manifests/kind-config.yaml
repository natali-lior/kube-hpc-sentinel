kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  # 1. Control Plane
  - role: control-plane
    kubeadmConfigPatches:
    - |
      kind: ClusterConfiguration
      controllerManager:
        extraArgs:
          bind-address: 0.0.0.0
      scheduler:
        extraArgs:
          bind-address: 0.0.0.0
      etcd:
        local:
          extraArgs:
            listen-metrics-urls: http://0.0.0.0:2381

  # 2. Infra Node (Tainted)
  # For: Ingress controllers, cert-manager, etc.
  - role: worker
    labels:
      hpc-sentinel/node-type: "infra"
    extraMounts:
      - hostPath: /var/lib/kubelet/device-plugins
        containerPath: /var/lib/kubelet/device-plugins
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: "node-role.kubernetes.io/infra"
              value: "true"
              effect: "NoSchedule"

  # 3. Observability Node (Tainted)
  # For: Prometheus, Grafana, Loki
  - role: worker
    labels:
      hpc-sentinel/node-type: "observability"
    extraMounts:
      - hostPath: /var/lib/kubelet/device-plugins
        containerPath: /var/lib/kubelet/device-plugins
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: "node-role.kubernetes.io/observability"
              value: "true"
              effect: "NoSchedule"

  # 4-5. Standard App Nodes (Untainted)
  # For: Regular microservices or your operator manager pod
  - role: worker
    labels:
      hpc-sentinel/node-type: "app"
    extraMounts:
      - hostPath: /var/lib/kubelet/device-plugins
        containerPath: /var/lib/kubelet/device-plugins
  - role: worker
    labels:
      hpc-sentinel/node-type: "app"
    extraMounts:
      - hostPath: /var/lib/kubelet/device-plugins
        containerPath: /var/lib/kubelet/device-plugins

  # 6-10. GPU Worker Nodes (Labeled)
  # Target for the Fake GPU Operator & Sentinel monitoring
  - role: worker
    labels:
      nvidia.com/gpu.present: "true"
      hpc-sentinel/node-type: "gpu-worker"
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: "nvidia.com/gpu"
              value: "true"
              effect: "NoSchedule"
    extraMounts:
      - hostPath: /var/lib/kubelet/device-plugins
        containerPath: /var/lib/kubelet/device-plugins
  - role: worker
    labels:
      nvidia.com/gpu.present: "true"
      hpc-sentinel/node-type: "gpu-worker"
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: "nvidia.com/gpu"
              value: "true"
              effect: "NoSchedule"
    extraMounts:
      - hostPath: /var/lib/kubelet/device-plugins
        containerPath: /var/lib/kubelet/device-plugins
  - role: worker
    labels:
      nvidia.com/gpu.present: "true"
      hpc-sentinel/node-type: "gpu-worker"
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: "nvidia.com/gpu"
              value: "true"
              effect: "NoSchedule"
    extraMounts:
      - hostPath: /var/lib/kubelet/device-plugins
        containerPath: /var/lib/kubelet/device-plugins
  - role: worker
    labels:
      nvidia.com/gpu.present: "true"
      hpc-sentinel/node-type: "gpu-worker"
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: "nvidia.com/gpu"
              value: "true"
              effect: "NoSchedule"
    extraMounts:
      - hostPath: /var/lib/kubelet/device-plugins
        containerPath: /var/lib/kubelet/device-plugins
  - role: worker
    labels:
      nvidia.com/gpu.present: "true"
      hpc-sentinel/node-type: "gpu-worker"
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: "nvidia.com/gpu"
              value: "true"
              effect: "NoSchedule"
    extraMounts:
      - hostPath: /var/lib/kubelet/device-plugins
        containerPath: /var/lib/kubelet/device-plugins
