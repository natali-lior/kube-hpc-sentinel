apiVersion: skaffold/v4beta3
kind: Config
metadata:
  name: hpc-sentinel
build:
  local:
    push: false 
    useBuildkit: true
  artifacts:
    - image: scenario-manager
      context: .
      docker:
        dockerfile: build/scenario-manager/Dockerfile
    - image: dcgm-mock-exporter
      context: .
      docker:
        dockerfile: build/dcgm-mock-exporter/Dockerfile
    - image: kube-hpc-sentinel
      context: .
      docker:
        dockerfile: build/manager/Dockerfile
manifests:
  rawYaml:
    - internal/provisioner/manifests/scenario-manager.yaml
    - internal/provisioner/manifests/dcgm-mock-exporter.yaml
    - internal/provisioner/manifests/grafana-dashboard.yaml
    - deploy/kube-hpc-sentinel.yaml
    - deploy/example-hpc-job.yaml
    - deploy/example-hpc-job-1.yaml
    - deploy/example-hpc-job-2.yaml
    - deploy/example-hpc-job-3.yaml
    - deploy/example-hpc-job-4.yaml
  
deploy:
  kubectl:
    hooks:
      before:
        - host:
            command: ["sh", "-c", "docker build -t fake-hpc-job -f build/fake-hpc-job/Dockerfile . && kind load docker-image fake-hpc-job --name hpc-sentinel-local"]
